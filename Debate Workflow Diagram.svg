<svg viewBox="0 0 760 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="780" fill="#ffffff"/>

  <!-- Stage 1 -->
  <rect x="130" y="20" width="500" height="50" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Profile Understanding Agent</text>
  <line x1="380" y1="70" x2="380" y2="90" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Stage 2 -->
  <rect x="90" y="92" width="580" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Experience Retrieval Agent</text>
  <text x="380" y="133" text-anchor="middle" font-size="10.5" fill="#555555">concurrent Neo4j + ChromaDB fetch</text>
  <line x1="380" y1="144" x2="380" y2="164" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Stage 3 -->
  <rect x="90" y="166" width="580" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Career Reasoning Agent</text>
  <text x="380" y="207" text-anchor="middle" font-size="10.5" fill="#555555">generates viable candidate trajectories + reachability scores</text>
  <line x1="380" y1="218" x2="380" y2="240" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Debate group -->
  <rect x="30" y="243" width="700" height="260" rx="10" fill="#FAFAFA" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="55" y="266" font-size="12" font-weight="700" fill="#555555">Graph-Grounded Multi-Agent Debate</text>

  <g stroke="#666666" stroke-width="1.1" fill="none">
    <line x1="380" y1="270" x2="380" y2="285"/>
    <line x1="150" y1="285" x2="610" y2="285"/>
    <line x1="150" y1="285" x2="150" y2="300" marker-end="url(#arrowGray)"/>
    <line x1="380" y1="285" x2="380" y2="300" marker-end="url(#arrowGray)"/>
    <line x1="610" y1="285" x2="610" y2="300" marker-end="url(#arrowGray)"/>
  </g>

  <!-- three debate agents, differentiated by fill shade + border style, darker/heavier = more adversarial -->
  <rect x="60" y="303" width="180" height="80" rx="6" fill="#F7F7F7" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="150" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Optimist</text>
  <text x="150" y="348" text-anchor="middle" font-size="10.5" fill="#333333">Ambitious, fast-growth</text>
  <text x="150" y="363" text-anchor="middle" font-size="10.5" fill="#333333">transitions</text>

  <rect x="290" y="303" width="180" height="80" rx="6" fill="#E9E9E9" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="380" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Realist</text>
  <text x="380" y="348" text-anchor="middle" font-size="10.5" fill="#333333">Conservative, precedent-</text>
  <text x="380" y="363" text-anchor="middle" font-size="10.5" fill="#333333">backed paths</text>

  <rect x="520" y="303" width="180" height="80" rx="6" fill="#DADADA" stroke="#1A1A1A" stroke-width="1.7" stroke-dasharray="2,2"/>
  <text x="610" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Critic</text>
  <text x="610" y="348" text-anchor="middle" font-size="10.5" fill="#333333">Adversarial feasibility check:</text>
  <text x="610" y="363" text-anchor="middle" font-size="10.5" fill="#333333">gaps, risks, blockers</text>

  <!-- converge to synthesizer -->
  <g stroke="#666666" stroke-width="1.1" fill="none">
    <line x1="150" y1="383" x2="150" y2="400"/>
    <line x1="380" y1="383" x2="380" y2="400"/>
    <line x1="610" y1="383" x2="610" y2="400"/>
    <line x1="150" y1="400" x2="610" y2="400"/>
    <line x1="380" y1="400" x2="380" y2="415" marker-end="url(#arrowGray)"/>
  </g>

  <rect x="90" y="418" width="580" height="65" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.9"/>
  <text x="380" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Synthesizer Agent</text>
  <text x="380" y="462" text-anchor="middle" font-size="10.5" fill="#444444" font-style="italic">reconciles debate_result &#8594; DebateOutput (feasibility-constrained)</text>

  <!-- exit debate group, continue pipeline -->
  <line x1="380" y1="483" x2="380" y2="528" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Stage: Experience Analysis -->
  <rect x="90" y="530" width="580" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Experience Analysis Agent</text>
  <text x="380" y="571" text-anchor="middle" font-size="10.5" fill="#555555">extracts recurring learning patterns and obstacles</text>
  <line x1="380" y1="582" x2="380" y2="602" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Stage: Mentor Discovery -->
  <rect x="90" y="604" width="580" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380" y="627" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Mentor Discovery Agent</text>
  <text x="380" y="645" text-anchor="middle" font-size="10.5" fill="#555555">near-peer candidates with Reachability(c) &#8805; 0.6</text>
  <line x1="380" y1="656" x2="380" y2="676" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <!-- Stage: Outreach -->
  <rect x="130" y="678" width="500" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.2"/>
  <text x="380" y="708" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Outreach Generation Agent</text>
</svg>
