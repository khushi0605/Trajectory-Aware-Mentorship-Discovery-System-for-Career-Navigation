provider: "ollama"

ollama:
  model: "qwen2.5-coder:3b"
  api_key: "ollama"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_output_tokens: 4096
  timeout_seconds: 60

groq:
  model: "openai/gpt-oss-120b"
  api_key: "${GROQ_API_KEY}"
  temperature: 0.1
  max_output_tokens: 4096
  timeout_seconds: 60

grounding:
  enforce_context_only: true
  max_context_tokens: 6000
