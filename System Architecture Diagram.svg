<svg viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1080" fill="#ffffff"/>

  <!-- Layer 1: Knowledge Source -->
  <text x="30" y="30" font-size="12" fill="#888888" letter-spacing="1">LAYER 1 — KNOWLEDGE SOURCE</text>
  <rect x="30" y="40" width="840" height="80" rx="8" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="450" y="75" text-anchor="middle" font-size="13" fill="#1A1A1A">GitHub &#8226; Resumes &#8226; Job Descriptions &#8226; Kaggle Profiles &#8226; Technical Blogs</text>
  <text x="450" y="95" text-anchor="middle" font-size="11" fill="#666666" font-style="italic">(unified via identity resolution, Fig. 1)</text>

  <line x1="450" y1="120" x2="450" y2="150" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow2)"/>

  <!-- Layer 2: Hybrid Retrieval -->
  <text x="30" y="145" font-size="12" fill="#888888" letter-spacing="1">LAYER 2 — HYBRID RETRIEVAL</text>
  <rect x="30" y="155" width="840" height="330" rx="10" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ChromaDB branch -->
  <rect x="70" y="180" width="360" height="270" rx="8" fill="#F2F2F2" stroke="#555555" stroke-width="1.3"/>
  <text x="250" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">ChromaDB &#8212; Vector Store</text>

  <g font-size="11.5" fill="#1A1A1A">
    <rect x="100" y="220" width="300" height="42" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="250" y="245" text-anchor="middle">Free-text input</text>
    <line x1="250" y1="262" x2="250" y2="274" stroke="#666666" marker-end="url(#arrow2)"/>

    <rect x="100" y="276" width="300" height="42" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="250" y="301" text-anchor="middle">all-MiniLM-L6-v2 embeddings</text>
    <line x1="250" y1="318" x2="250" y2="330" stroke="#666666" marker-end="url(#arrow2)"/>

    <rect x="100" y="332" width="300" height="42" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="250" y="357" text-anchor="middle">Cosine similarity (q &#183; d / |q||d|)</text>
    <line x1="250" y1="374" x2="250" y2="386" stroke="#666666" marker-end="url(#arrow2)"/>

    <rect x="100" y="388" width="300" height="42" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="250" y="413" text-anchor="middle">Top-5 narrative chunks</text>
  </g>

  <!-- Neo4j branch -->
  <rect x="470" y="180" width="360" height="270" rx="8" fill="#F2F2F2" stroke="#555555" stroke-width="1.3"/>
  <text x="650" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">Neo4j &#8212; Graph Store</text>

  <g font-size="11.5" fill="#1A1A1A">
    <rect x="500" y="222" width="300" height="90" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="650" y="242" text-anchor="middle" font-weight="600">Nodes</text>
    <text x="650" y="260" text-anchor="middle" font-size="10.5">Candidate, Job Role, Skill,</text>
    <text x="650" y="275" text-anchor="middle" font-size="10.5">Decision, Struggle, Domain</text>

    <line x1="650" y1="312" x2="650" y2="324" stroke="#666666" marker-end="url(#arrow2)"/>

    <rect x="500" y="326" width="300" height="90" rx="5" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="650" y="346" text-anchor="middle" font-weight="600">Edges (directed)</text>
    <text x="650" y="364" text-anchor="middle" font-size="10.5">HAS_SKILL</text>
    <text x="650" y="379" text-anchor="middle" font-size="10.5">TRIGGERED_TRANSITION</text>
    <text x="650" y="394" text-anchor="middle" font-size="10.5">MADE_DECISION</text>
  </g>

  <!-- merge to RetrievalContext -->
  <g stroke="#1A1A1A" stroke-width="1.2" fill="none">
    <line x1="250" y1="450" x2="250" y2="470"/>
    <line x1="650" y1="450" x2="650" y2="470"/>
    <line x1="250" y1="470" x2="650" y2="470"/>
    <line x1="450" y1="470" x2="450" y2="490" marker-end="url(#arrow2)"/>
  </g>

  <rect x="270" y="493" width="360" height="55" rx="6" fill="#E8E8E8" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="450" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Unified RetrievalContext</text>
  <text x="450" y="531" text-anchor="middle" font-size="10.5" fill="#333333">trajectory paths + narrative chunks + metadata</text>

  <line x1="450" y1="548" x2="450" y2="573" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrow2)"/>

  <!-- Layer 3: Multi-agent reasoning -->
  <text x="30" y="598" font-size="12" fill="#888888" letter-spacing="1">LAYER 3 — MULTI-AGENT REASONING</text>
  <rect x="30" y="608" width="840" height="440" rx="10" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <g font-size="12.5" fill="#1A1A1A">
    <rect x="220" y="630" width="460" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
    <text x="450" y="661" text-anchor="middle" font-weight="600">Profile Understanding Agent</text>
    <line x1="450" y1="682" x2="450" y2="697" stroke="#1A1A1A" marker-end="url(#arrow2)"/>

    <rect x="220" y="699" width="460" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
    <text x="450" y="730" text-anchor="middle" font-weight="600">Experience Retrieval Agent</text>
    <line x1="450" y1="751" x2="450" y2="766" stroke="#1A1A1A" marker-end="url(#arrow2)"/>

    <rect x="220" y="768" width="460" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
    <text x="450" y="795" text-anchor="middle" font-weight="600">Career Reasoning Agent</text>
    <text x="450" y="811" text-anchor="middle" font-size="10.5" font-weight="400" fill="#555555">(with graph-grounded debate — Fig. 3)</text>
    <line x1="450" y1="820" x2="450" y2="835" stroke="#1A1A1A" marker-end="url(#arrow2)"/>

    <rect x="220" y="837" width="460" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
    <text x="450" y="868" text-anchor="middle" font-weight="600">Experience Analysis Agent</text>
    <line x1="450" y1="889" x2="450" y2="904" stroke="#1A1A1A" marker-end="url(#arrow2)"/>

    <rect x="220" y="906" width="460" height="52" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.3"/>
    <text x="450" y="937" text-anchor="middle" font-weight="600">Mentor Discovery Agent</text>
    <line x1="450" y1="958" x2="450" y2="973" stroke="#1A1A1A" marker-end="url(#arrow2)"/>

    <rect x="220" y="975" width="460" height="52" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.2"/>
    <text x="450" y="1006" text-anchor="middle" font-weight="700">Outreach Generation Agent</text>
  </g>
</svg>
