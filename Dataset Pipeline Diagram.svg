<svg viewBox="0 0 1000 1020" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1020" fill="#ffffff"/>

  <text x="20" y="20" font-size="11" fill="#888888" letter-spacing="1">DATA SOURCES</text>

  <g font-size="13" fill="#1A1A1A">
    <g>
      <rect x="50" y="30" width="170" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
      <text x="135" y="59" text-anchor="middle">GitHub Profiles</text>
    </g>
    <g>
      <rect x="232.5" y="30" width="170" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
      <text x="317.5" y="59" text-anchor="middle">Resume Datasets</text>
    </g>
    <g>
      <rect x="415" y="30" width="170" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
      <text x="500" y="59" text-anchor="middle">Job Descriptions</text>
    </g>
    <g>
      <rect x="597.5" y="30" width="170" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
      <text x="682.5" y="59" text-anchor="middle">Kaggle Profiles</text>
    </g>
    <g>
      <rect x="780" y="30" width="170" height="50" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"/>
      <text x="865" y="59" text-anchor="middle">Technical Blogs</text>
    </g>
  </g>

  <g stroke="#1A1A1A" stroke-width="1.2" fill="none">
    <line x1="135" y1="80" x2="135" y2="105"/>
    <line x1="317.5" y1="80" x2="317.5" y2="105"/>
    <line x1="500" y1="80" x2="500" y2="105"/>
    <line x1="682.5" y1="80" x2="682.5" y2="105"/>
    <line x1="865" y1="80" x2="865" y2="105"/>
    <line x1="135" y1="105" x2="865" y2="105"/>
    <line x1="500" y1="105" x2="500" y2="145" marker-end="url(#arrow)"/>
  </g>

  <!-- Preprocessing group -->
  <rect x="150" y="150" width="700" height="335" rx="10" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="500" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#444444">Multi-Stage Preprocessing Pipeline</text>

  <g font-size="12.5">
    <rect x="200" y="190" width="600" height="58" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="500" y="214" text-anchor="middle" font-weight="600" fill="#1A1A1A">Ingestion</text>
    <text x="500" y="232" text-anchor="middle" font-size="11" fill="#444444">Parse heterogeneous source records into per-source schemas</text>

    <line x1="500" y1="248" x2="500" y2="263" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="200" y="265" width="600" height="58" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="500" y="289" text-anchor="middle" font-weight="600" fill="#1A1A1A">Normalization</text>
    <text x="500" y="307" text-anchor="middle" font-size="11" fill="#444444">Unify field names, units, and formats across platforms</text>

    <line x1="500" y1="323" x2="500" y2="338" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="200" y="340" width="600" height="58" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="500" y="364" text-anchor="middle" font-weight="600" fill="#1A1A1A">Transformation</text>
    <text x="500" y="382" text-anchor="middle" font-size="11" fill="#444444">Construct skill vectors, domain labels, experience representations</text>

    <line x1="500" y1="398" x2="500" y2="413" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="200" y="415" width="600" height="58" rx="6" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.2"/>
    <text x="500" y="439" text-anchor="middle" font-weight="600" fill="#1A1A1A">Identity Construction</text>
    <text x="500" y="457" text-anchor="middle" font-size="11" fill="#444444">Assemble unified per-candidate career representation</text>
  </g>

  <line x1="500" y1="485" x2="500" y2="510" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Equation box -->
  <rect x="230" y="515" width="540" height="62" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="500" y="540" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">MatchScore = w1&#183;S_skill + w2&#183;S_domain + w3&#183;S_experience</text>
  <text x="500" y="562" text-anchor="middle" font-size="11" fill="#777777">Cross-source identity alignment (weighted similarity)</text>

  <line x1="500" y1="577" x2="500" y2="602" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- three classification bins: darker = stronger match -->
  <g font-size="12.5">
    <rect x="60" y="605" width="280" height="70" rx="6" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1.6"/>
    <text x="200" y="628" text-anchor="middle" font-weight="600" fill="#1A1A1A">Strong Match</text>
    <text x="200" y="646" text-anchor="middle" font-size="11" fill="#1A1A1A">MatchScore &#8805; 0.75</text>
    <text x="200" y="663" text-anchor="middle" font-size="10.5" fill="#1A1A1A">&#8594; merged</text>

    <rect x="360" y="605" width="280" height="70" rx="6" fill="#ECECEC" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,3"/>
    <text x="500" y="628" text-anchor="middle" font-weight="600" fill="#333333">Moderate Match</text>
    <text x="500" y="646" text-anchor="middle" font-size="11" fill="#333333">0.5 &#8804; MatchScore &lt; 0.75</text>
    <text x="500" y="663" text-anchor="middle" font-size="10.5" fill="#333333">&#8594; merged</text>

    <rect x="660" y="605" width="280" height="70" rx="6" fill="#F7F7F7" stroke="#999999" stroke-width="1.1" stroke-dasharray="2,2"/>
    <text x="800" y="628" text-anchor="middle" font-weight="600" fill="#555555">Weak Match</text>
    <text x="800" y="646" text-anchor="middle" font-size="11" fill="#555555">MatchScore &lt; 0.5</text>
    <text x="800" y="663" text-anchor="middle" font-size="10.5" fill="#555555">&#8594; kept separate</text>
  </g>

  <g stroke="#1A1A1A" stroke-width="1.2" fill="none">
    <line x1="200" y1="675" x2="200" y2="700"/>
    <line x1="500" y1="675" x2="500" y2="700"/>
    <line x1="200" y1="700" x2="500" y2="700"/>
    <line x1="350" y1="700" x2="350" y2="735" marker-end="url(#arrow)"/>
    <line x1="800" y1="675" x2="800" y2="735" marker-end="url(#arrow)"/>
  </g>

  <rect x="130" y="740" width="450" height="95" rx="8" fill="#E8E8E8" stroke="#1A1A1A" stroke-width="1.6"/>
  <text x="355" y="765" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Unified Professional Identity</text>
  <text x="355" y="785" text-anchor="middle" font-size="11" fill="#333333">Skill vectors &#8226; career trajectories</text>
  <text x="355" y="801" text-anchor="middle" font-size="11" fill="#333333">project records &#8226; domain labels</text>

  <rect x="650" y="740" width="270" height="95" rx="8" fill="#F5F5F5" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="785" y="770" text-anchor="middle" font-size="13" font-weight="600" fill="#555555">Retained as</text>
  <text x="785" y="788" text-anchor="middle" font-size="13" font-weight="600" fill="#555555">Independent Entity</text>

  <g stroke="#1A1A1A" stroke-width="1.2" fill="none">
    <line x1="355" y1="835" x2="355" y2="855"/>
    <line x1="785" y1="835" x2="785" y2="855"/>
    <line x1="355" y1="855" x2="785" y2="855"/>
    <line x1="500" y1="855" x2="500" y2="875" marker-end="url(#arrow)"/>
  </g>

  <!-- Final dataset box: heaviest weight, top of hierarchy -->
  <rect x="130" y="880" width="740" height="110" rx="8" fill="#ffffff" stroke="#1A1A1A" stroke-width="2.2"/>
  <text x="500" y="908" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">Structured Career Intelligence Dataset</text>
  <text x="500" y="930" text-anchor="middle" font-size="11.5" fill="#333333">521 GitHub &#8226; 9,544 resumes &#8226; 1,068 job descriptions &#8226; 49,093 Kaggle profiles</text>
  <text x="500" y="950" text-anchor="middle" font-size="11.5" fill="#333333">&#8594; 5,610 graph nodes / 53,293 relationships (Neo4j) + 6,508 indexed documents (ChromaDB)</text>
  <text x="500" y="972" text-anchor="middle" font-size="10.5" fill="#666666" font-style="italic">Input to the Hybrid Retrieval Layer (Fig. 2)</text>
</svg>
